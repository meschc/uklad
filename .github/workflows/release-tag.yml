# Тег версии ставится сам. Версия продукта числом не хранится: это база из
# `package.json` плюс число записей в `changes/` (правило — CLAUDE.md, «Версия
# продукта»; счёт — `scripts/release.mjs`). PR кладёт свою запись файлом и не
# трогает ни версию, ни CHANGELOG.md, поэтому PR не конфликтуют друг с другом.
#
# Когда в main приходит новая запись, этот прогон ставит тег `vX.Y.Z` на этот
# коммит и выпускает релиз на GitHub с текстом записей, добавленных после
# прошлого тега. Коммитов в main прогон не делает (правила ветки main этого и не
# дали бы), поэтому staging и демо получают версию из того же счёта при сборке.
#
# Тег уже есть — ничего не делаем, повторный прогон безопасен. Секретов не
# нужно: хватает прав самого прогона (`contents: write`).
name: Тег версии

on:
  push:
    branches: [main]
    paths: [changes/**, package.json]
  # Кнопка «поставить тег руками» — например, если прогон упал.
  workflow_dispatch:

permissions:
  contents: write

# Прогоны идут по одному. Ожидающий заменяется более новым — не беда: новый
# соберёт записи от прошлого тега, в том числе и те, что ждали.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Тег и релиз
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Версия по записям
        id: v
        run: |
          version=$(node scripts/release.mjs version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Тег v$version уже есть — пропускаю."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Текст релиза — записи, добавленные после прошлого тега. Записей нет
      # (тег ставят руками на старую версию) — релиз выходит с честной пометкой.
      - name: Тег и релиз
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD)
          node scripts/release.mjs notes "$prev" "$GITHUB_SHA" > notes.md
          if [ ! -s notes.md ]; then
            echo "Записей в changes/ с прошлого тега нет." > notes.md
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Уклад $VERSION" --notes-file notes.md
