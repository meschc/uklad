# Выкладка на staging.u-klad.ru: main прошёл CI — сервер обновляется сам.
#
# Прогон заходит на сервер ключом, который умеет только одно: запустить
# `deploy/deploy.sh` (в authorized_keys у ключа `command=…`, без терминала и
# без проброса портов). Войти по нему в консоль нельзя. Ключ и отпечаток
# сервера лежат в секретах репозитория, в коде их нет. Разовая настройка —
# deploy/README.md, «Автовыкладка».
name: Выкладка на staging

on:
  # Только после зелёного CI на main: красный коммит на сервер не едет.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Повторить руками, когда код не менялся (например, поменяли .env).
  workflow_dispatch:

permissions:
  contents: read

# Две выкладки сразу не идут; начатую не обрываем — сервер остался бы
# между версиями.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Обновить staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ключ и отпечаток сервера
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Нет секретов STAGING_SSH_KEY / STAGING_KNOWN_HOSTS — см. deploy/README.md, «Автовыкладка»"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/staging
          chmod 600 ~/.ssh/staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Что запустить, решает сервер (command= в authorized_keys), а не прогон.
      # Отпечаток сверяется строго: подменённый сервер ключ не получит.
      - name: Выкладка
        run: >-
          ssh -i ~/.ssh/staging
          -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
          -o ServerAliveInterval=30 -o ConnectTimeout=20
          deploy@168.113.176.106
