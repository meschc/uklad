# Публикация демоверсии: собранный `dist/` уезжает на GitHub Pages и открывается
# на домене u-klad.ru.
#
# Раньше здесь была другая схема: сборка складывалась в отдельный публичный
# репозиторий `meschc/uklad-site` силовым пушем по личному токену. Причина была
# одна — `meschc/uklad` был приватным, а Pages из приватного репозитория
# работает только на платном тарифе. Репозиторий стал публичным, и вся эта
# конструкция стала лишней: второй репозиторий, токен с правом записи, который
# надо заводить руками и раз в год продлевать, и история, которую всё равно
# каждый раз затирали. Ничего из этого больше нет.
#
# Выкладка идёт официальным способом: артефакт со сборкой отдаётся Pages прямо
# отсюда, правами самого прогона (`permissions: pages: write`). Секретов не
# нужно ни одного.
#
# Почему проверки тут не гоняются второй раз. Тот же коммит уже проверяет
# `ci.yml` — формат, линтер, типы, тесты и сквозные. Сборка здесь своя и
# обязательная: `npm run build` начинается с `tsc -b`, поэтому с ошибкой типов
# не опубликуется ничего.
name: Публикация демо

on:
  push:
    branches: [main]
  # Кнопка «выложить руками»: пригодится после смены настроек домена, когда
  # код не менялся, а выкладку повторить надо.
  workflow_dispatch:

# Права выдаются прогону, а не человеку: `pages` — чтобы выложить, `id-token` —
# чтобы Pages поверил, что артефакт пришёл именно из этого репозитория.
# Остального у прогона нет, и записать он никуда больше не может.
permissions:
  contents: read
  pages: write
  id-token: write

# Двух одновременных выкладок быть не должно: публикуется всегда последнее
# состояние main. Текущую при этом не обрываем — прерванная выкладка оставит
# сайт в половинчатом виде до следующего пуша.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Сборка целиком: Vite, серверный бандл и предрендер. Именно предрендер
      # раскладывает страницы папками и кладёт карту сайта с доменом.
      - run: npm run build

      # `CNAME` и `.nojekyll` лежат в `public/` и попадают в `dist/` сами.
      # Проверяем, что это действительно так: без `CNAME` GitHub Pages отвяжет
      # домен на первой же выкладке, и сайт тихо переедет на *.github.io.
      - name: Проверить домен и отключение Jekyll
        run: |
          test -f dist/.nojekyll
          grep -qx "u-klad.ru" dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Выкладка
    needs: build
    runs-on: ubuntu-latest
    # Окружение `github-pages` — то самое, что видно в настройках репозитория
    # со ссылкой на последнюю выкладку. Адрес сайта берётся из ответа Pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
