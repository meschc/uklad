# Публикация демоверсии: собранный `dist/` уезжает в отдельный публичный
# репозиторий, откуда его отдаёт GitHub Pages на домене u-klad.ru.
#
# Почему не Pages прямо отсюда. `meschc/uklad` приватный, а Pages из приватного
# репозитория работает только на платном тарифе. Разделение к тому же честнее
# по сути: наружу уходит собранный сайт, а исходники остаются закрытыми — это
# ровно та граница, которую хотелось провести.
#
# Почему дерево кладётся заново, а не коммитом поверх. Публичный репозиторий —
# не история разработки, а слепок последней сборки; история живёт здесь. Если
# коммитить поверх, он распухнет двоичными диффами шрифтов и фотографий, из
# которых никто никогда ничего не восстановит.
#
# Почему проверки тут не гоняются второй раз. Тот же коммит уже проверяет
# `ci.yml` — формат, линтер, типы, тесты и сквозные, — а минуты приватного
# репозитория конечны. Сборка здесь своя и обязательная: `npm run build`
# начинается с `tsc -b`, поэтому с ошибкой типов не опубликуется ничего.
name: Публикация демо

on:
  push:
    branches: [main]
  # Кнопка «выложить руками»: пригодится после смены настроек домена, когда
  # код не менялся, а выкладку повторить надо.
  workflow_dispatch:

# Двух одновременных выкладок быть не должно: публикуется всегда последнее
# состояние main. Текущую при этом не обрываем — прерванная выкладка оставит
# публичный репозиторий в половинчатом виде, и сайт ляжет до следующего пуша.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Сборка и выкладка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Сборка целиком: Vite, серверный бандл и предрендер. Именно предрендер
      # раскладывает 154 страницы папками и кладёт карту сайта с доменом.
      - run: npm run build

      # `CNAME` и `.nojekyll` лежат в `public/` и попадают в `dist/` сами.
      # Проверяем, что это действительно так: без `CNAME` GitHub Pages отвяжет
      # домен на первой же выкладке, и сайт тихо переедет на *.github.io.
      - name: Проверить домен и отключение Jekyll
        run: |
          test -f dist/.nojekyll
          grep -qx "u-klad.ru" dist/CNAME

      # Токен — мелкозернистый PAT с правом «Contents: write» ровно к одному
      # репозиторию `meschc/uklad-site`. В коде и в бандле его нет: секрет
      # подставляется в окружение шага и живёт только внутри раннера.
      - name: Выложить dist/ в meschc/uklad-site
        env:
          TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        working-directory: dist
        run: |
          git init -q -b main
          git config user.name "Уклад, выкладка"
          git config user.email "deploy@u-klad.ru"
          git add -A
          git commit -q -m "Сборка ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/meschc/uklad-site.git" main
