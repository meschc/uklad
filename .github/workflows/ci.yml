# Проверки на каждое изменение: то же, что гоняется руками перед коммитом, но
# на чистой машине и с зафиксированными зависимостями.
#
# Смысл именно в чистой машине. Локально проект собирается на том, что уже
# лежит в `node_modules`, и пропущенная зависимость или файл, забытый в
# `git add`, обнаруживаются только у следующего человека, который склонирует
# репозиторий. Здесь это выясняется сразу.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Пока идёт проверка, а сверху прилетел новый коммит, — старый прогон уже
# никому не нужен. Отменяем его, чтобы не жечь минуты приватного репозитория.
# Прогону нужно только прочитать код. Без этой строки токен прогона получает
# права по умолчанию, а они у старых репозиториев включают запись.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Формат, линтер, типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Версия берётся из `.nvmrc` — одна запись на проект, а не вторая
          # копия числа, которую забудут поднять.
          node-version-file: .nvmrc
          cache: npm

      # `ci`, а не `install`: ставит ровно то, что записано в `package-lock`,
      # и падает, если файл разошёлся с `package.json`.
      - run: npm ci

      # Порядок от дешёвого к дорогому: чем раньше падение, тем короче ожидание.
      - name: Формат
        run: npm run format:check

      - name: Линтер
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      # Сборка последней, и она же — проверка предрендера: `scripts/prerender.mjs`
      # прогоняет витрину через Node и падает на всём, что живёт только в
      # браузере.
      - name: Сборка
        run: npm run build

      # Отдельный кабинет под app.u-klad.ru (ADR 0008). Пока поддомен не
      # подключён, эту сборку никто не запускает руками — без проверки здесь
      # она сломалась бы молча.
      - name: Сборка кабинета
        run: npm run build:app

      # Сервер заявок (`server/api`) — свои тесты на встроенном `node:test`,
      # без зависимостей: почта в них подменена, база — в памяти.
      - name: Тесты сервера
        run: node --test server/api/test/*.test.js

  # Изоляция компаний в Postgres (data-architecture.md, 5а). Отдельное задание,
  # чтобы в списке проверок оно было видно само по себе: его падение значит,
  # что одна компания может увидеть данные другой, и вливать нельзя.
  db:
    name: Изоляция компаний (Postgres)
    runs-on: ubuntu-latest
    # Весь прогон — меньше минуты. Зависание должно падать за минуты, а не
    # висеть до шестичасового предела GitHub.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/db/package-lock.json

      - run: npm ci
        working-directory: server/db

      - name: Миграции и тесты изоляции
        working-directory: server/db
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm test

      # Вход в кабинет — HTTP-сервер поверх той же схемы.
      - run: npm ci
        working-directory: server/api

      # Компанию, склад и человека в транзакции ставят только функции auth
      # (ADR 0009). Код сервера, который делает это сам, обходит проверку входа.
      - name: Нет set_config в коде сервера
        run: "! grep -rnEi \"set_config|\\bSET +(LOCAL +)?app\\.\" server/api/src"

      - name: Тесты входа в кабинет и чата
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node --test server/api/test/auth.pg.test.mjs server/api/test/chat.pg.test.mjs

  # Образы для своего сервера (deploy/). Пока сервер не подключён, их никто не
  # собирает — без проверки здесь они сломались бы молча к дню запуска.
  docker:
    name: Образы сервера
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Конфиг compose
        working-directory: deploy
        # В образце пароли базы пустые нарочно: без них compose на сервере
        # не стартует. Для проверки синтаксиса подставляем заглушки.
        env:
          PG_SUPERUSER_PASSWORD: ci
          PG_OWNER_PASSWORD: ci
          PG_APP_PASSWORD: ci
          PG_NOTIFIER_PASSWORD: ci
        run: cp .env.example .env && docker compose config --quiet

      - name: Образ миграций
        run: docker build -f server/db/Dockerfile -t uklad-migrate server/db

      - name: Образ сервера заявок
        run: docker build -f server/api/Dockerfile -t uklad-api server

      - name: Образ сайта
        run: docker build -f deploy/web.Dockerfile -t uklad-web .

      - name: Конфиг Caddy
        run: >-
          docker run --rm -e SITE_DOMAIN=example.ru -e ACME_EMAIL=a@example.ru
          uklad-web caddy validate --config /etc/caddy/Caddyfile

      - name: Сервер заявок отвечает
        run: |
          docker run -d --name api -p 8080:8080 -e SMTP_USER=x -e SMTP_PASSWORD=x -e MAIL_TO=x@example.ru uklad-api
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          docker logs api; exit 1

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Только Chromium: все три проекта в `playwright.config.ts` — на нём,
      # включая телефонные. Полный набор движков тянул бы ещё и WebKit с
      # Firefox, которых тесты не открывают.
      - name: Браузер для Playwright
        run: npx playwright install --with-deps chromium

      # Сборку и статический сервер поднимает сам Playwright (`webServer` в
      # конфиге) — отдельного шага здесь не нужно.
      - name: Прогон
        run: npm run test:e2e

      # Отчёт нужен ровно тогда, когда что-то упало: по зелёному прогону его
      # никто не открывает, а место он занимает.
      - name: Отчёт о падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
