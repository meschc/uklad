<!--
  Знак Wildberries. Буквы вынесены в отдельный белый контур, а не оставлены
  дырками в фиолетовой плашке: в исходном файле весь знак был одним путём с
  fill-rule="evenodd", и «Wb» были не нарисованы, а прорезаны насквозь. Пока
  под знаком белая страница, дырки выглядят белыми буквами; в BrandMark он
  лежит на плитке своего же фиолетового цвета — и буквы пропадали целиком.
  Внутри белого контура evenodd остаётся: им сделан просвет внутри «b».
-->
