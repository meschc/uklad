<!doctype html>
<!-- Страница для хостинга, а не для приложения.

     Витрина живёт на хэше (`/#/market`), и адрес с обычным путём — `/market`,
     `/sklad`, что угодно после домена — до неё вообще не доходит: файла с
     таким именем на диске нет, и статический хостинг отдаёт свою собственную
     страницу ошибки. У GitHub Pages это «There isn't a GitHub Pages site
     here» — чужой бренд в лицо человеку, который искал наш склад. Этот файл
     хостинги подставляют вместо неё: Pages — сам, nginx — по строке
     `error_page 404 /404.html`.

     Отсюда и всё остальное устройство файла. Никакой сборки: страницу отдают
     ровно в том виде, в каком она лежит, поэтому стили инлайном, а не из
     Tailwind. Никаких скриптов ради оформления: они здесь не обязаны
     выполниться. Тема — по настройке устройства, как и на витрине. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница не найдена — Уклад</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap"
    />
    <style>
      :root {
        --bg: hsl(222 24% 5%);
        --fg: hsl(220 16% 93%);
        --muted: hsl(220 10% 62%);
        --border: hsl(222 14% 17%);
        --primary: hsl(226 100% 55%);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: hsl(220 33% 99%);
          --fg: hsl(222 24% 10%);
          --muted: hsl(220 10% 40%);
          --border: hsl(220 16% 88%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 460px;
        text-align: center;
      }

      .code {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 12px 0 0;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }

      .actions {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      a {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 24px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 14px;
        font-weight: 500;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s, color 0.15s;
      }

      a:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      a.plain {
        border-color: transparent;
        padding: 0 8px;
        color: var(--muted);
      }

      a.plain:hover {
        color: var(--fg);
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Ошибка 404</p>
      <h1>Такой страницы нет</h1>
      <p>
        Адрес набран с ошибкой или ссылка устарела. Витрина складов и всё
        остальное — на главной.
      </p>
      <div class="actions">
        <a href="/#/market">Смотреть склады</a>
        <a class="plain" href="/">На главную</a>
      </div>
    </main>

    <!-- Разделы витрины различаются хэшем, но набирают их руками как обычные
         пути — «uklad.ru/pricing» вместо «uklad.ru/#/pricing». Такой адрес
         приводит сюда, хотя раздел существует и человек не ошибся ничем, кроме
         одного знака. Известные имена переводим на их настоящий адрес, всё
         остальное остаётся этой страницей: сюда попадают и опечатки, и старые
         ссылки на разделы, которых у нас никогда не было. -->
    <script>
      (function () {
        var KNOWN = ["market", "sellers", "pricing", "contacts", "legal", "warehouse"];
        var head = window.location.pathname.replace(/^\/+|\/+$/g, "").split("/")[0];
        if (KNOWN.indexOf(head) === -1) return;
        window.location.replace("/#" + window.location.pathname.replace(/\/+$/, ""));
      })();
    </script>
  </body>
</html>
